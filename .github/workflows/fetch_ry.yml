name: Fetch Radar 5min (RY) and Generate Webp

on:
  workflow_dispatch:

concurrency:
  # verhindert, dass zwei Laeufe gleichzeitig dieselbe Datei generieren/hochladen
  group: fetch-radar5min
  cancel-in-progress: false

env:
  # RY-Dateien liegen auf 5-Minuten-Raster (z. B. ...-2610040925-...) und erscheinen ca. 2-4 min danach
  RY_BASE_URL: "https://opendata.dwd.de/weather/radar/radolan/ry"
  RY_DIR: "data/ry"

jobs:
  fetch_generate_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.LIVE_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache Python packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download aktuelle RY-Datei (DWD Open Data, mit Retry)
        run: |
          mkdir -p "$RY_DIR"
          rm -f "$RY_DIR"/raa01-ry_10000-*-dwd---bin.hdf5

          # Aktueller 5-Minuten-Slot UTC, z. B. 12:16 -> 12:15
          LATEST=$(( ($(date -u +%s) / 300) * 300 ))
          echo "Aktueller Slot: $(date -u -d @"$LATEST" '+%Y-%m-%d %H:%M') UTC"

          fetch() {   # $1 = Dateiname; 0 = ok, 1 = nicht verfuegbar
            local name="$1" tmp="${RUNNER_TEMP}/$1" code
            code=$(curl -s -o "$tmp" -w "%{http_code}" \
              --connect-timeout 10 --max-time 120 \
              "${RY_BASE_URL}/${name}" || echo "000")
            if [ "$code" = "200" ] && [ -s "$tmp" ]; then
              mv "$tmp" "${RY_DIR}/${name}"
              return 0
            fi
            rm -f "$tmp"
            LAST_CODE="$code"
            return 1
          }

          name_for() { echo "raa01-ry_10000-$(date -u -d @"$1" +%y%m%d%H%M)-dwd---bin.hdf5"; }

          # Neuester Slot mit vielen Versuchen (kann noch nicht hochgeladen sein),
          # danach Fallback auf die zwei Slots davor (je 2 Versuche)
          ok=0
          for k in 0 1 2; do
            name=$(name_for $(( LATEST - k * 300 )))
            if [ "$k" = "0" ]; then attempts=24; else attempts=2; fi
            for i in $(seq 1 "$attempts"); do
              if fetch "$name"; then
                echo "Geladen (Slot -$((k * 5)) min, Versuch $i/$attempts): $name"
                echo "RY_FILE=${RY_DIR}/${name}" >> "$GITHUB_ENV"
                ok=1
                break
              fi
              echo "Versuch $i/$attempts: $name noch nicht verfuegbar (HTTP $LAST_CODE)."
              sleep 5
            done
            [ "$ok" = "1" ] && break
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Keine RY-Datei fuer die letzten 3 Slots verfuegbar - Abbruch."
            exit 1
          fi

      - name: Generate radarsumme5min_latest.webp
        run: python scripts/generate_ry.py "$RY_FILE"

      - name: Upload radarsumme5min_latest.webp to R2 (mit Retry)
        run: |
          MAX_ATTEMPTS=3
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            if aws s3 cp ./output/radarsumme5min/radarsumme5min_latest.webp \
                s3://${{ secrets.R2_BUCKET }}/radarsumme/radarsumme5min_latest.webp \
                --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com; then
              echo "Upload erfolgreich (Versuch $i/$MAX_ATTEMPTS)."
              exit 0
            fi
            echo "Upload fehlgeschlagen (Versuch $i/$MAX_ATTEMPTS), warte 10s..."
            sleep 10
          done
          echo "::error::Upload nach $MAX_ATTEMPTS Versuchen fehlgeschlagen."
          exit 1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}